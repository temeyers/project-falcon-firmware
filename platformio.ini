[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; 6-axis alternative: LSM6DS3 / LSM6DSO with gyro door-swing detection
[env:xiao_lsm6ds3]
extends = env:seeed_xiao_esp32c3
build_flags =
  ${env:seeed_xiao_esp32c3.build_flags}
  -DIMU_LSM6DS3

; M5StickC Plus2 (ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM). Onboard MPU6886 (gyro door swing + accel motion),
; passive buzzer GPIO2 (quiet), Button A GPIO37, HOLD GPIO4. Board def per M5 docs: m5stick-c.
[env:m5stickc_plus2]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -DBOARD_M5STICKC_PLUS2
  -DIMU_MPU6886

; M5StickS3 (ESP32-S3-PICO-1-N8R8). BMI270 IMU, ES8311 + AW8737 speaker, M5PM1 PMIC - all via M5Unified. Per M5 docs.
[env:m5sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota_8MB.csv   ; dual OTA slots, same layout as default_8MB (NVS unchanged)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
build_flags =
  -DBOARD_M5STICKS3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Unified

; M5StickS3 battery build: deep sleep + BMI270 any-motion wake via M5PM1 IRQ (G13), light sleep during loads.
[env:m5sticks3_sleep]
extends = env:m5sticks3
build_flags =
  ${env:m5sticks3.build_flags}
  -DSLEEP_ENABLED
lib_deps =
  ${env:m5sticks3.lib_deps}
  m5stack/M5PM1
  sparkfun/SparkFun BMI270 Arduino Library

; LAN OTA push (ArduinoOTA / espota) - USB build. Password is NOT stored here; pass it at upload time:
;   PLATFORMIO_UPLOAD_FLAGS="--auth=$OTA_PASS" pio run -e m5sticks3_ota -t upload --upload-port <puck-ip>
; (OTA_PASS must match the value in include/secrets.h; puck must already run an OTA-capable build.)
[env:m5sticks3_ota]
extends = env:m5sticks3
upload_protocol = espota
upload_flags =
  --port=3232
